name: Render approved Dark Tech week 2026-11-02
on:
  push:
    paths:
      - scripts/render_darktech_20261102.py
      - .github/workflows/render-darktech-20261102.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-darktech-20261102
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install pillow numpy
      - run: python scripts/render_darktech_20261102.py
      - name: Validate and publish generated media
        run: |
          python -c "import json; from pathlib import Path; p=Path('artifacts/darktech-20261102'); m=json.loads((p/'manifest.json').read_text()); assert len(m)==14; assert all(Path(f).stat().st_size>0 for x in m for f in x['files'])"
          git config user.name media-bot
          git config user.email media-bot@users.noreply.github.com
          git add artifacts/darktech-20261102
          git diff --cached --quiet && exit 0
          git commit -m "Render approved 7 Reels and 7 carousels for 02-08 November"
          git pull --rebase origin main
          git push origin main
