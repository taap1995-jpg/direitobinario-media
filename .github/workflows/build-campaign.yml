name: Gerar pacote de mídia do Direito Binário
on:
  push:
    paths:
      - 'campanha-outubro-2026/**'
      - '.github/workflows/build-campaign.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências de mídia
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          python -m pip install --upgrade pip pillow
      - name: Renderizar artes, Reels e áudio
        run: python scripts/generate_campaign.py
      - name: Commitar arquivos renderizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campanha-outubro-2026/gerados
          git diff --cached --quiet || (git commit -m "build: render campaign assets for Instagram" && git push)
