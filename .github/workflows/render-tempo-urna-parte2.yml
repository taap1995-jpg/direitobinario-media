name: Render Parte 2 Tempo na Urna
on:
  push:
    paths:
      - '.github/workflows/render-tempo-urna-parte2.yml'
      - 'reels/tempo-urna-parte2-20261027/render.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow edge-tts
      - name: Render
        run: python reels/tempo-urna-parte2-20261027/render.py
      - name: Save media
        run: |
          git config user.name 'media-bot'
          git config user.email 'media-bot@users.noreply.github.com'
          git add media/reels/tempo-urna-parte2-20261027
          git commit -m 'Renderiza Parte 2 tempo na urna: vídeo e capa'
          git pull --rebase origin main
          git push origin main
