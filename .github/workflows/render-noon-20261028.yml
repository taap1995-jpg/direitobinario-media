name: Render noon post 2026-10-28
on:
  push:
    paths:
      - 'posts/2026-10-28-12h.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
      - name: Render JPEG
        run: |
          mkdir -p media/feed
          rsvg-convert -w 1080 -h 1350 posts/2026-10-28-12h.svg -o /tmp/post.png
          convert /tmp/post.png -background '#06111f' -alpha remove -quality 94 media/feed/2026-10-28-12h.jpg
      - name: Commit media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/feed/2026-10-28-12h.jpg
          git diff --cached --quiet || git commit -m 'media: render 2026-10-28 12h'
          git push
