name: BEAT Music Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render six-scene BEAT Reel with background music
        run: |
          set -euo pipefail
          mkdir -p renders work
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          declare -a TITLES=(
            "A IA DESLIGOU QUEM VIGIAVA ELA"
            "UM AGENTE INTERFERIU NO MONITORAMENTO"
            "E NÃO RECONHECEU A AÇÃO"
            "QUEM RESPONDE SE HOUVER DANO?"
            "EMPRESA, DESENVOLVEDOR OU USUÁRIO?"
            "IA AUTÔNOMA EXIGE RESPONSABILIDADE HUMANA"
          )
          for i in 0 1 2 3 4 5; do
            n=$((i+1))
            ffmpeg -y -f lavfi -i "color=c=0x07111f:s=1080x1920:d=5:r=30" \
              -vf "drawbox=x=60:y=110:w=960:h=1700:color=0x00e5ff@0.08:t=4,drawbox=x=95:y=145:w=890:h=1630:color=0xc9a84c@0.05:t=3,drawtext=fontfile=${FONT}:text='BEAT // DIREITO BINÁRIO':fontcolor=0x00e5ff:fontsize=42:x=(w-text_w)/2:y=170,drawtext=fontfile=${FONT}:text='${TITLES[$i]}':fontcolor=white:fontsize=58:x=(w-text_w)/2:y=(h-text_h)/2:box=1:boxcolor=black@0.35:boxborderw=30,drawtext=fontfile=${FONT}:text='0 1 0 1  //  ⚖  //  1 0 1 0':fontcolor=0xc9a84c:fontsize=36:x=(w-text_w)/2:y=1650" \
              -c:v libx264 -pix_fmt yuv420p "work/scene-${n}.mp4"
          done
          printf "file '%s'\n" "$PWD/work/scene-1.mp4" "$PWD/work/scene-2.mp4" "$PWD/work/scene-3.mp4" "$PWD/work/scene-4.mp4" "$PWD/work/scene-5.mp4" "$PWD/work/scene-6.mp4" > work/list.txt
          ffmpeg -y -f concat -safe 0 -i work/list.txt -c copy work/video.mp4
          ffmpeg -y -f lavfi -i "sine=frequency=110:sample_rate=48000:duration=30" -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=30" \
            -filter_complex "[0:a]volume=0.035[a0];[1:a]volume=0.012[a1];[a0][a1]amix=inputs=2,afade=t=in:st=0:d=1,afade=t=out:st=28:d=2[a]" \
            -map "[a]" -c:a aac -b:a 128k work/music.m4a
          ffmpeg -y -i work/video.mp4 -i work/music.m4a -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 128k -shortest -movflags +faststart renders/reel-beat-music.mp4

      - name: Technical QA
        run: |
          ffprobe -v error -show_streams -show_format renders/reel-beat-music.mp4
          test $(stat -c%s renders/reel-beat-music.mp4) -gt 100000

      - name: Commit final MP4 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f renders/reel-beat-music.mp4
          if git diff --cached --quiet; then
            echo "Render unchanged"
          else
            git commit -m "render: BEAT music Reel"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
