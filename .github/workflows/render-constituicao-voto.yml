name: Render Reel Constitucional 26-10
on:
  push:
    paths:
      - '.github/workflows/render-constituicao-voto.yml'
      - 'reels/constituicao-voto-20261026/render.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-constituicao-voto
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow numpy
      - name: Render approved video
        run: python reels/constituicao-voto-20261026/render.py
      - name: Save media
        run: |
          git config user.name 'media-bot'
          git config user.email 'media-bot@users.noreply.github.com'
          git add media/reels/constituicao-voto-20261026
          if ! git diff --cached --quiet; then
            git commit -m 'Renderiza Reel constitucional com música original'
            git pull --rebase origin main
            git push origin main
          fi
