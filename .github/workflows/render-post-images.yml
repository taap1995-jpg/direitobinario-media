name: render-post-images
on:
  push:
    paths:
      - 'posts/**/*.json'
      - 'scripts/make_post_image.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-post-images
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
      - name: Renderizar artes pendentes
        run: |
          for f in posts/*.json; do
            out="${f%.json}.jpg"
            if [ ! -f "$out" ]; then
              python scripts/make_post_image.py "$f"
            fi
          done
      - name: Commit das imagens
        run: |
          git config user.name 'media-bot'
          git config user.email 'media-bot@users.noreply.github.com'
          git add posts/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Renderiza artes dos posts'
            git pull --rebase origin main
            git push
          fi
