name: render-post-images
on:
  push:
    paths:
      - 'posts/**/*.json'
      - 'scripts/make_post_image.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
      - name: Renderizar artes
        run: |
          for f in posts/*.json; do
            python scripts/make_post_image.py "$f"
          done
      - name: Commit das imagens
        run: |
          git config user.name 'media-bot'
          git config user.email 'media-bot@users.noreply.github.com'
          git add posts/*.jpg
          git diff --cached --quiet || git commit -m 'Renderiza artes dos posts'
          git push
