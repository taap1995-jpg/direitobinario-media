name: Render editorial Reels
on:
  workflow_dispatch:
    inputs:
      full_render:
        description: Render full video after visual approval
        required: false
        default: 'false'
  push:
    paths:
      - 'reels/editorial/*.json'
      - 'scripts/render_editorial_reel.py'
permissions:
  contents: write
concurrency:
  group: render-editorial-reels
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow
      - name: Visual QA preview scene 3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_render != 'true' }}
        run: python scripts/render_editorial_reel.py reels/editorial/2026-10-28-tse-ia-eleicoes.json --preview-scene 3
      - name: Full render after approval
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_render == 'true' }}
        run: python scripts/render_editorial_reel.py reels/editorial/2026-10-28-tse-ia-eleicoes.json
      - name: Save QA preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_render != 'true' }}
        run: |
          git config user.name 'media-bot'
          git config user.email 'media-bot@users.noreply.github.com'
          git add renders/*-qa-scene-03.png
          if ! git diff --cached --quiet; then
            git commit -m 'QA visual: cena 3 editorial'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Save full media
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_render == 'true' }}
        run: |
          git config user.name 'media-bot'
          git config user.email 'media-bot@users.noreply.github.com'
          git add media/reels/
          if ! git diff --cached --quiet; then
            git commit -m 'Renderiza Reel editorial após QA visual'
            git pull --rebase origin main
            git push origin main
          fi
