name: Render editorial Reels
on:
  push:
    paths:
      - 'reels/editorial/*.json'
      - 'scripts/render_editorial_reel.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-editorial-reels
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow
      - name: Render editorial videos
        run: |
          found=0
          for f in reels/editorial/*.json; do
            if python - "$f" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f"::warning file={p}::Skipping invalid JSON: {exc}")
              raise SystemExit(1)
          required = ('slug', 'scenes')
          missing = [key for key in required if key not in data]
          if missing:
              print(f"::notice file={p}::Skipping non-render spec; missing: {', '.join(missing)}")
              raise SystemExit(1)
          PY
            then
              echo "Rendering $f"
              python scripts/render_editorial_reel.py "$f"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No valid editorial reel specs found."
            exit 1
          fi
      - name: Save public media
        run: |
          git config user.name 'media-bot'
          git config user.email 'media-bot@users.noreply.github.com'
          git add media/reels/
          if ! git diff --cached --quiet; then
            git commit -m 'Renderiza Reels editoriais e QA técnico'
            git pull --rebase origin main
            git push origin main
          fi
