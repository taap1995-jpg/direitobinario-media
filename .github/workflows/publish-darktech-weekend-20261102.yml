name: Validate weekend Instagram fallback
on:
  push:
    paths:
      - scripts/publish_darktech_weekend_20261102.py
      - .github/workflows/publish-darktech-weekend-20261102.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-publish-direitobinario
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing account credential without publishing
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/publish_darktech_weekend_20261102.py --validate-only
      - name: Save validation result
        if: always()
        run: |
          git config user.name media-bot
          git config user.email media-bot@users.noreply.github.com
          git add logs/darktech-weekend-health.json
          git diff --cached --quiet && exit 0
          git commit -m "Record weekend fallback credential validation"
          git pull --rebase origin main
          git push origin main
